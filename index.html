<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitAPI Studio - GitHub & Custom REST API Hub for Vercel</title>
    <meta name="description" content="Nền tảng tạo, kiểm thử và xuất API REST tùy chỉnh từ GitHub repositories và mock data, sẵn sàng triển khai lên Vercel Serverless." />
    <meta property="og:title" content="GitAPI Studio - GitHub & Custom REST API Hub for Vercel" />
    <meta property="og:description" content="Nền tảng tạo, kiểm thử và xuất API REST tùy chỉnh từ GitHub repositories và mock data, sẵn sàng triển khai lên Vercel Serverless." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // HMR is disabled in AI Studio iframe environment. Suppress WebSocket disconnection rejections.
      window.addEventListener('unhandledrejection', function(event) {
        var msg = event.reason && (event.reason.message || String(event.reason));
        var stack = event.reason && event.reason.stack;
        if (
          (msg && (msg.includes('WebSocket') || msg.includes('vite:ws'))) ||
          (stack && stack.includes('@vite/client'))
        ) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      window.addEventListener('error', function(event) {
        if (
          (event.message && (event.message.includes('WebSocket') || event.message.includes('vite:ws'))) ||
          (event.filename && event.filename.includes('@vite/client'))
        ) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
